name: Build and checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check logic
        run: |
          ./scripts/check-toolchain.sh
          ./scripts/test.sh
      - name: Build app and bundled helper
        run: ./scripts/build.sh
      - name: Verify architecture and deployment target
        shell: bash
        run: |
          for binary in "dist/Display Mini.app/Contents/MacOS/DisplayMini" "dist/Display Mini.app/Contents/Helpers/m1ddc"; do
            test "$(lipo -archs "$binary")" = arm64
            xcrun vtool -show-build "$binary" | tee /tmp/display-mini-build-info.txt
            grep -Eq 'minos +14\.0' /tmp/display-mini-build-info.txt
          done
      - name: Package preview artifact
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Display-Mini-macOS-arm64
          path: |
            dist/Display-Mini-*.zip
            dist/Display-Mini-*.sha256
          if-no-files-found: error
          retention-days: 14
